name: 00 - Infrastructure

on:
  # Plan and apply when infrastructure code changes
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/monitoring/**"
      - ".github/workflows/00-infrastructure.yml"

  # Manual run: plan, apply or destroy
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read

env:
  # Terraform azurerm provider reads these
  ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
  TF_IN_AUTOMATION: "true"

jobs:

  # =========================================================
  # Terraform: validate, plan, apply
  # =========================================================
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    outputs:
      applied: ${{ steps.apply.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event.inputs.action != 'destroy'
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
          echo '### Terraform plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Apply on push to main, or manual "apply"
      - name: Terraform apply
        id: apply
        if: >
          github.event_name == 'push' ||
          github.event.inputs.action == 'apply'
        run: terraform apply -input=false tfplan

      - name: Terraform output
        if: steps.apply.outcome == 'success'
        run: terraform output

      # Manual "destroy" only, to save Azure credit
      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve

  # =========================================================
  # Monitoring: Prometheus and Grafana on AKS
  # =========================================================
  monitoring:
    name: Deploy Prometheus and Grafana
    runs-on: ubuntu-latest
    needs: terraform
    if: needs.terraform.outputs.applied == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install or upgrade kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f kubernetes/monitoring/kube-prometheus-values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait \
            --timeout 10m

      - name: Validate monitoring stack
        run: |
          kubectl get pods -n monitoring

          # Prometheus must answer and report targets
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090 &
          sleep 8
          TARGETS=$(curl -s "http://localhost:9090/api/v1/query?query=up" | jq '.data.result | length')
          echo "Prometheus targets reporting: $TARGETS"
          test "$TARGETS" -gt 0

      - name: Show Grafana address
        run: |
          for i in {1..30}; do
            IP=$(kubectl get svc kube-prometheus-stack-grafana -n monitoring \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "Grafana: http://$IP" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Grafana IP not ready yet"
